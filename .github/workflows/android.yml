name Android CI
on push and workflow_dispatch
jobs
 build runs on ubuntu-latest
 steps
  uses actions checkout v4
  uses actions setup-java v4 with java version 17 and distribution temurin
  run chmod plus x gradlew
  run ./gradlew assembleDebug
  uses actions upload-artifact v4 with name app-debug and path app/build/outputs/apk/debug/app-debug.apk
